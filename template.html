<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Picker</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1f2328; --muted:#667085; --line:#d9d5cc;
  --accent:#8a3ffc; --accent-ink:#ffffff; --soft:#f0eafd; --field:#fbfaf8; --ok:#1a7f37;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15161a; --panel:#1e2026; --ink:#e8e6e1; --muted:#9aa1ad; --line:#33363f;
    --accent:#a878ff; --accent-ink:#14101f; --soft:#2a2440; --field:#17181d; --ok:#56d364; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;padding:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btnrow{margin-top:10px}
.btnrow button{padding:7px 6px}
label.inline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px;white-space:nowrap}
label.inline select{margin-top:0;flex:1;min-width:0;padding:4px 8px}
button.copy{margin-top:4px;padding:9px 12px}
button.copy.done{background:var(--ok);border-color:var(--ok)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
h1{font-size:18px;margin:0 0 10px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:6px 0 0}
select,input[type=search],textarea{width:100%;margin-top:3px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
textarea{resize:vertical;font:12.5px/1.45 ui-monospace,Consolas,"Cascadia Mono",monospace}
button{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btns{display:grid;gap:6px;margin-top:10px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.phead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;min-height:22px}
#title{font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notes{font-size:12px;color:var(--muted);margin:0 0 6px;white-space:pre-wrap}
#notes:empty{display:none}
.slot{border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;margin-top:8px;background:var(--field);display:flex;flex-direction:column;min-height:0}
.slot:first-child{margin-top:0}
.slot.locked{border-color:var(--accent);background:var(--soft)}
.slot-head{display:flex;align-items:center;gap:8px}
.slot-head b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-head .src{display:none}
.slot-head label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.slot-head button{padding:2px 9px;font-size:12px}
.slot textarea{background:var(--panel);margin-top:5px;min-height:56px}
#out{position:fixed;left:-9999px;top:0;width:10px;height:10px;opacity:0}
.outbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.checks{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-size:12.5px;color:var(--muted)}
#msg{color:#c4320a;font-size:12.5px;margin:6px 0 0}
#msg:empty{display:none}

/* Wide, tall-enough screens: everything on one screen, the text boxes stretch to fill it. */
@media (min-width:1100px) and (min-height:600px){
  html,body{height:100%}
  body{overflow:hidden}
  main{height:100vh}
  .panel{display:flex;flex-direction:column;min-height:0}
  .controls{overflow-y:auto}
  #slots{flex:1;display:flex;flex-direction:column;min-height:0}
  .slot{flex:1}
  .slot textarea{flex:1;resize:none;min-height:0}
}
/* Phones: one column. */
@media (max-width:700px){
  main{grid-template-columns:minmax(0,1fr);padding:12px 16px}
}
</style>
</head>
<body>
<main>
  <section class="panel controls">
    <label class="f" style="margin-top:0">Search<input id="fSearch" type="search"></label>
    <div class="row2">
      <label class="f">Game<select id="fGame"></select></label>
      <label class="f">Gender<select id="fGender">
        <option value="">Any</option><option value="female">Female</option><option value="male">Male</option><option value="other">Creatures/pairs</option>
      </select></label>
    </div>
    <label class="f">Character<select id="charSel"></select></label>
    <div class="row2 btnrow">
      <button id="btnRandChar" class="primary">Random</button>
      <button id="btnMix" class="primary">True random</button>
    </div>
    <label class="inline">Body in true random<select id="optBody">
      <option value="sometimes">50%</option><option value="always">Always</option><option value="never">Never</option>
    </select></label>
    <p id="msg"></p>
    <div class="btns"><button id="btnCopy" class="primary copy">Copy prompt</button></div>
    <div class="checks">
      <label><input type="checkbox" id="optFixed" checked> Include the quality tags</label>
    </div>

    <details>
      <summary>Settings</summary>
      <label class="f">Quality tags (never randomized)<textarea id="fixed" rows="9"></textarea></label>
      <div class="outbar"><button id="btnResetFixed">Reset quality tags</button></div>
    </details>
  </section>

  <section class="panel">
    <div class="phead"><p id="title">Pick a character or press a random button</p></div>
    <p id="notes"></p>
    <div id="slots"></div>
  </section>

</main>
<textarea id="out" readonly tabindex="-1" aria-hidden="true"></textarea>

<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const DEFAULT_FIXED = "(masterpiece:1.4), (best quality:1.3), (ultra detail:1.3), (8k resolution:1.2), absurdres, highres, sharp focus, skin texture, detailed shading, volumetric lighting, dramatic lighting, depth of field, vibrant colors, aesthetic, studio anime style, anime screencap style, clean lineart, awe-inspiring, amazing quality, ultra-detailed, detailed hair, individual hair strands, beautiful face, intricate face, soft lips, smooth skin, glossy skin, (artist:mazjojo:0.75), (artist:pigeon666:0.70),(artist:zawar379:0.80), (artist:remsrar:0.65),(artist:chimmyming:0.72), (artist:yoneyama mai:0.73), TAxStyle, Pixie_eyelashes, Wada Arco style,";
const LITE_DROP = ["skin texture", "soft lips", "smooth skin", "glossy skin"];
const GAMES = {1:"Custom prompts", 2:"Fantasy originals", 3:"Fate/Grand Order", 4:"Genshin Impact", 5:"Honkai: Star Rail", 6:"Epic Seven", 7:"Unicorn Overlord", 8:"Stardew Valley", 9:"Honkai Impact 3rd", 10:"Fire Emblem Heroes", 11:"Arknights", 12:"Azur Lane", 13:"Zenless Zone Zero", 14:"Blue Archive", 15:"Uma Musume", 16:"Granblue Fantasy", 17:"Nikke", 18:"Wuthering Waves", 19:"Punishing: Gray Raven", 20:"Reverse: 1999"};
const SLOTS = [
  {k:"face",    label:"Face, hair, eyes, head accessories"},
  {k:"body",    label:"Body features"},
  {k:"clothes", label:"Clothes and accessories"},
  {k:"pose",    label:"Camera, pose and action"},
  {k:"scene",   label:"Setting, framing and body type"}
];
// Extra body-feature bundles for true random, so this section works for every gender and game.
const BODY_POOL = [
  {name:"Scars", t:"(scars, scar across chest, scar on arm, old battle scars, healed wounds)"},
  {name:"Tribal tattoos", t:"(tribal tattoo, arm tattoo, shoulder tattoo, black ink markings, linework tattoo)"},
  {name:"Glowing runes", t:"(glowing runes on skin, glowing tattoo, magic circuit lines, blue glowing markings)"},
  {name:"Dragon scales", t:"(scales on cheek, scaled forearms, scaled shoulders, iridescent scales, sharp claws)"},
  {name:"Dragon tail", t:"(thick dragon tail, scaled tail, tail spikes, tail curled behind)"},
  {name:"Bat wings", t:"(black bat wings, demon wings, leathery wings, wing claws, wings half spread)"},
  {name:"Feathered wings", t:"(white feathered wings, angel wings, large wings, drifting feathers)"},
  {name:"Black feathered wings", t:"(black feathered wings, fallen angel wings, ragged feathers, wings folded)"},
  {name:"Demon tail", t:"(demon tail, spade tail, slender black tail, tail curled upward)"},
  {name:"Fox tails", t:"(fox tail, large fluffy tail, multiple tails, white tail tips)"},
  {name:"Cat tail", t:"(cat tail, long slender tail, tail swaying, fluffy tail tip)"},
  {name:"Wolf tail", t:"(wolf tail, bushy grey tail, thick fur)"},
  {name:"Stitches", t:"(stitches, stitched skin, stitched arm, black thread, patchwork skin, two-tone skin)"},
  {name:"Extra eyes", t:"(extra eyes, additional eyes:1.2), (eye on forehead, eye on cheek, eye on hand), uneven eyes, body horror"},
  {name:"Prosthetic arm", t:"(mechanical arm, prosthetic arm, metal fingers, exposed gears, brass plating)"},
  {name:"Doll joints", t:"(doll joints, ball-jointed arms, seam lines on skin, porcelain skin)"},
  {name:"Crystal growths", t:"(crystal growths on skin, crystals on shoulders, glowing crystal shards embedded in arms)"},
  {name:"Burn scars", t:"(burn scars, burnt skin on arm, cracked skin, embers glowing in cracks)"},
  {name:"Cursed arm", t:"(cursed arm, black arm, blackened fingers, dark veins spreading, red glowing cracks)"},
  {name:"Bandages", t:"(bandages, bandaged arm, bandaged torso, wrapped hands, blood stains on bandages)"},
  {name:"Freckles", t:"(freckles, freckles on shoulders, sun-kissed skin, tan lines)"},
  {name:"Body chains", t:"(chains in skin, broken shackles on wrists, chain marks, rusted iron links)"},
  {name:"Plant growth", t:"(vines growing on body, leaves on skin, flowers sprouting from shoulders, bark-like skin patches)"},
  {name:"Fins", t:"(fin ears, head fins, small arm fins, scales on hips, webbed fingers)"},
  {name:"Ghostly", t:"(translucent body, ghostly fade at fingertips, wispy edges, faint blue glow)"},
  {name:"Insect wings", t:"(insect wings, translucent butterfly wings, iridescent wing pattern)"},
  {name:"Third eye", t:"(third eye, eye on forehead, glowing third eye, forehead mark)"},
  {name:"Muscles", t:"(muscular, toned abs, defined arms, veins, broad shoulders)"}
];
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const trimTail = t => t.trim().replace(/[,\s]+$/, "");

// Split on commas that are outside brackets; "\(" and "\)" are literal and do not count.
function splitTop(s){
  const out = []; let depth = 0, cur = "";
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (c === "\\" && i + 1 < s.length){ cur += c + s[i+1]; i++; continue; }
    if (c === "(") depth++;
    else if (c === ")") depth = Math.max(0, depth - 1);
    if (c === "," && depth === 0){ if (cur.trim()) out.push(cur.trim()); cur = ""; }
    else cur += c;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

// The data is prebuilt by build.ps1 as one compact array per character:
// [code, name, part, group, gender(0 female, 1 male, 2 other), flags(1 short quality line, 2 several people),
//  tag, face, body, clothes, pose, framing index, body-type tags, notes, extra BREAK lines]
// The fixed parts of the last section are added back here instead of being stored for every character.
const COUNTS = ["solo, 1girl", "solo, 1boy", "solo, no humans", "2girls", "2boys", "1boy, 1girl", "solo, 1other"];
const GENDERS = ["female", "male", "other"];
function readData(rows){
  return rows.map(r => {
    const gender = GENDERS[r[4]], lite = !!(r[5] & 1), multi = !!(r[5] & 2);
    return {
      code: r[0], name: r[1], part: r[2], group: r[3], game: GAMES[r[2]] || ("Part " + r[2]),
      gender, lite, multi, mixable: !lite && !multi && (gender === "male" || gender === "female"),
      tag: r[6], face: r[7], body: r[8], clothes: r[9], pose: r[10],
      scene: "(white background, no background), (" + COUNTS[r[11]] + ", cowboy shot), " + (r[12] ? r[12] + ", " : "") + "colored extremities",
      notes: r[13], extra: r[14]
    };
  });
}

let DB = [], LIST = [];
const state = {title:"", meta:"", notes:"", lite:false, mixable:false, gender:"", parts:{}, src:{}, locks:{}};

function store(key, val){ try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch(e){ return null; } }
function fixedLine(){ return $("fixed").value.replace(/\s*\n\s*/g, " ").trim() || DEFAULT_FIXED; }

function buildPrompt(){
  const lines = [];
  if ($("optFixed").checked){
    let fx = fixedLine();
    if (state.lite) fx = splitTop(fx).filter(t => LITE_DROP.indexOf(t.toLowerCase()) < 0).join(", ");
    fx = trimTail(fx) + ",";
    lines.push(fx);
  }
  for (const s of SLOTS){
    const t = trimTail(state.parts[s.k] || "");
    if (!t) continue;
    lines.push("BREAK " + t + (s.k === "scene" ? "" : ","));
  }
  return lines.join("\n");
}

function refresh(){
  $("title").textContent = state.title || "Pick a character or press a random button";
  $("notes").textContent = state.notes;
  for (const s of SLOTS){
    const ta = $("ta_" + s.k);
    if (ta.value !== (state.parts[s.k] || "")) ta.value = state.parts[s.k] || "";
    $("lock_" + s.k).checked = !!state.locks[s.k];
    $("slot_" + s.k).classList.toggle("locked", !!state.locks[s.k]);
  }
  $("out").value = buildPrompt();
}

function setChar(e){
  const label = e.code + " " + e.name;
  state.parts = {
    face: (e.tag ? e.tag + " " : "") + e.face,
    body: e.body, clothes: e.clothes,
    pose: e.pose + e.extra.map(x => ",\nBREAK " + x).join(""),
    scene: e.scene
  };
  state.src = {}; for (const s of SLOTS) state.src[s.k] = state.parts[s.k] ? label : "none";
  state.locks = {};
  state.title = e.code + " · " + e.name;
  state.meta = [e.game, e.group, e.source].filter(Boolean).join(" · ");
  state.notes = e.notes;
  state.lite = e.lite; state.mixable = e.mixable; state.gender = e.gender;
  $("msg").textContent = "";
  refresh();
}

function mix(only){
  const game = $("fGame").value, fg = $("fGender").value;
  $("msg").textContent = "";
  if (fg === "other"){ $("msg").textContent = "True random only mixes single male or female characters. Set Gender to Any, Female or Male."; return; }
  // Gender "Any" mixes male and female freely, section by section; a set gender keeps every section to it.
  const g = fg;
  const pool = DB.filter(e => e.mixable && (!game || String(e.part) === game) && (!g || e.gender === g));
  if (!pool.length){ $("msg").textContent = g ? "No " + g + " characters to mix in this game." : "Nothing in this game can be mixed."; return; }
  const anyLock = SLOTS.some(s => state.locks[s.k]);
  const keep = state.mixable && (!!only || anyLock);
  if (!keep){ state.locks = {}; only = null; state.parts = {}; state.src = {}; }
  for (const s of SLOTS){
    if (only && s.k !== only) continue;
    if (!only && state.locks[s.k]) continue;
    if (s.k === "body"){
      const mode = $("optBody").value;
      const use = only ? mode !== "never" : (mode === "always" || (mode === "sometimes" && Math.random() < 0.5));
      const bp = pool.filter(e => e.body)
        .map(e => ({t: e.body, src: e.code + " " + e.name}))
        .concat(BODY_POOL.map(b => ({t: b.t, src: "built-in: " + b.name})));
      if (use){
        const first = pick(bp); let t = first.t, src = first.src;
        if (Math.random() < 0.3){ const second = pick(BODY_POOL); if (second.t !== t){ t += ", " + second.t; src += " + " + second.name; } }
        state.parts.body = t; state.src.body = src;
      } else { state.parts.body = ""; state.src.body = "none"; }
      continue;
    }
    const e = pick(pool);
    state.parts[s.k] = e[s.k]; state.src[s.k] = e.code + " " + e.name;
  }
  state.title = "True random mix";
  state.notes = ""; state.lite = false; state.mixable = true; state.gender = g;
  $("charSel").value = "";
  refresh();
}

function rebuildList(){
  const game = $("fGame").value, g = $("fGender").value, q = $("fSearch").value.trim().toLowerCase();
  LIST = DB.filter(e => (!game || String(e.part) === game) && (!g || e.gender === g) &&
    (!q || (e.code + " " + e.name + " " + e.group).toLowerCase().indexOf(q) >= 0));
  const sel = $("charSel"); sel.innerHTML = "";
  const first = document.createElement("option"); first.value = ""; first.textContent = "— choose (" + LIST.length + ") —"; sel.appendChild(first);
  let og = null, key = "";
  LIST.forEach(e => {
    const k = e.game + (e.group ? " — " + e.group : "");
    if (k !== key){ og = document.createElement("optgroup"); og.label = k; sel.appendChild(og); key = k; }
    const o = document.createElement("option"); o.value = e.code; o.textContent = e.code + "  " + e.name; og.appendChild(o);
  });
}

function loadDB(rows){
  const d = readData(rows);
  if (!d.length) return false;
  DB = d;
  const fg = $("fGame"), cur = fg.value; fg.innerHTML = "";
  const all = document.createElement("option"); all.value = ""; all.textContent = "All games (" + DB.length + ")"; fg.appendChild(all);
  const seen = {};
  DB.forEach(e => { seen[e.part] = (seen[e.part] || 0) + 1; });
  Object.keys(seen).sort((a, b) => a - b).forEach(p => {
    const o = document.createElement("option"); o.value = p; o.textContent = (GAMES[p] || ("Part " + p)) + " (" + seen[p] + ")"; fg.appendChild(o);
  });
  if (seen[cur]) fg.value = cur;
  rebuildList();
  return true;
}

function init(){
  const box = $("slots");
  SLOTS.forEach(s => {
    const d = document.createElement("div"); d.className = "slot"; d.id = "slot_" + s.k;
    d.innerHTML = '<div class="slot-head"><b></b><span class="src"></span>' +
      '<label><input type="checkbox" id="lock_' + s.k + '"> keep</label>' +
      '<button type="button" id="re_' + s.k + '" title="Reroll only this section">Reroll</button></div>' +
      '<textarea id="ta_' + s.k + '" rows="3" spellcheck="false"></textarea>';
    d.querySelector("b").textContent = s.label;
    box.appendChild(d);
    $("ta_" + s.k).addEventListener("input", ev => { state.parts[s.k] = ev.target.value; $("out").value = buildPrompt(); });
    $("lock_" + s.k).addEventListener("change", ev => { state.locks[s.k] = ev.target.checked; refresh(); });
    $("re_" + s.k).addEventListener("click", () => mix(s.k));
  });
  $("fixed").value = store("pp_fixed") || DEFAULT_FIXED;
  $("optFixed").checked = store("pp_incfixed") !== "0";
  $("fixed").addEventListener("input", () => { store("pp_fixed", $("fixed").value); $("out").value = buildPrompt(); });
  $("btnResetFixed").addEventListener("click", () => { $("fixed").value = DEFAULT_FIXED; store("pp_fixed", DEFAULT_FIXED); $("out").value = buildPrompt(); });
  $("optFixed").addEventListener("change", () => { store("pp_incfixed", $("optFixed").checked ? "1" : "0"); $("out").value = buildPrompt(); });
  ["fGame", "fGender"].forEach(id => $(id).addEventListener("change", rebuildList));
  $("fSearch").addEventListener("input", rebuildList);
  $("charSel").addEventListener("change", () => { const e = DB.find(x => x.code === $("charSel").value); if (e) setChar(e); });
  $("btnRandChar").addEventListener("click", () => {
    if (!LIST.length){ $("msg").textContent = "No characters match the filters."; return; }
    const e = pick(LIST); $("charSel").value = e.code; setChar(e);
  });
  $("btnMix").addEventListener("click", () => mix(null));
  $("btnCopy").addEventListener("click", () => {
    if (!SLOTS.some(s => (state.parts[s.k] || "").trim())){ $("msg").textContent = "Pick a character first."; return; }
    $("msg").textContent = "";
    const t = buildPrompt(); $("out").value = t;
    const btn = $("btnCopy");
    const done = () => { btn.textContent = "Copied ✓"; btn.classList.add("done"); clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = "Copy prompt"; btn.classList.remove("done"); }, 1500); };
    const fallback = () => { $("out").removeAttribute("readonly"); $("out").select(); try { document.execCommand("copy"); done(); } catch(e){ $("msg").textContent = "Copy failed; your browser blocked it."; } $("out").setAttribute("readonly", ""); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
  });
  loadDB(JSON.parse($("data").textContent));
  refresh();
}
init();
</script>
</body>
</html>
