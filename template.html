<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Picker</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --ink:#1f2328; --muted:#667085; --line:#d9d5cc;
  --accent:#8a3ffc; --accent-ink:#ffffff; --soft:#f0eafd; --field:#fbfaf8; --ok:#1a7f37;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15161a; --panel:#1e2026; --ink:#e8e6e1; --muted:#9aa1ad; --line:#33363f;
    --accent:#a878ff; --accent-ink:#14101f; --soft:#2a2440; --field:#17181d; --ok:#56d364; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:flex;gap:6px;margin-top:10px}
.row3 button{flex:1 1 auto;padding:8px 6px;white-space:nowrap;font-size:13.5px}
label.inline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:7px;white-space:nowrap}
label.inline select{margin-top:0;flex:1;min-width:0;padding:4px 8px}
button.copy.done{background:var(--ok);border-color:var(--ok)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.qhead button,.qfoot button{padding:2px 9px;font-size:12px}
.tabs{display:flex;gap:4px}
.tabs button.tab{padding:2px 10px;font-size:12.5px;border-radius:999px;background:transparent;color:var(--muted)}
.tabs button.tab.on{background:var(--soft);border-color:var(--accent);color:var(--ink)}
textarea.box{margin-top:5px}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;margin-top:3px}
.tok{font-size:11.5px;color:var(--muted);white-space:nowrap;cursor:help}
.tok.over{color:#c4320a}
.badge{flex:none;font-size:11px;line-height:1.7;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:help}
.tools{flex:none;display:flex;align-items:center;gap:6px}
.tools button{padding:3px 10px;font-size:12.5px}
.tools select{width:auto;max-width:210px;margin:0;padding:3px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{border-color:var(--line)}
[hidden]{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
h1{font-size:18px;margin:0 0 10px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:5px 0 0}
select,input[type=search],textarea{width:100%;margin-top:3px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit}
select:disabled{opacity:.55}
textarea{resize:vertical;font:12.5px/1.45 ui-monospace,Consolas,"Cascadia Mono",monospace}
button{font:inherit;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:26px}
#title{flex:0 1 auto;min-width:0;font-size:15px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .tools{margin-left:auto}
#notes{font-size:12px;color:var(--muted);margin:0 0 6px;white-space:pre-wrap}
#notes:empty{display:none}
.slot{border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;margin-top:8px;background:var(--field);display:flex;flex-direction:column;min-height:0}
.slot:first-child{margin-top:0}
.slot.locked{border-color:var(--accent);background:var(--soft)}
.slot-head{display:flex;align-items:center;gap:8px}
.slot-head b{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-head .src{display:none}
.slot-head .tok{margin-right:2px}
.slot-head label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.slot-head button{padding:2px 9px;font-size:12px}
.slot textarea{background:var(--panel);margin-top:5px;min-height:56px}
#out{position:fixed;left:-9999px;top:0;width:10px;height:10px;opacity:0}
.checks{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:12.5px;margin-top:8px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
#msg{color:#c4320a;font-size:12.5px;margin:6px 0 0}
#msg:empty{display:none}

/* Wide, tall-enough screens: everything on one screen, the text boxes stretch to fill it
   (the quality tags box takes whatever room the controls leave). */
@media (min-width:900px) and (min-height:540px){
  html,body{height:100%}
  body{overflow:hidden}
  main{height:100vh}
  .panel{display:flex;flex-direction:column;min-height:0}
  .controls{overflow-y:auto}
  .controls textarea.box{flex:1 1 auto;min-height:64px;resize:none}
  #slots{flex:1;display:flex;flex-direction:column;min-height:0}
  .slot{flex:1}
  .slot textarea{flex:1;resize:none;min-height:0}
}
/* Phones: one column. */
@media (max-width:700px){
  main{grid-template-columns:minmax(0,1fr);padding:12px 16px}
  .phead{flex-wrap:wrap}
}
</style>
</head>
<body>
<main>
  <section class="panel controls">
    <label class="f" style="margin-top:0" title="A name, a game, or looks. Separate looks with commas: white hair, glasses">Search<input id="fSearch" type="search" placeholder="Name or looks: white hair, glasses"></label>
    <div class="row2">
      <label class="f">Game<select id="fGame"></select></label>
      <label class="f">Gender<select id="fGender">
        <option value="">Any</option><option value="female">Female</option><option value="male">Male</option><option value="other">Creatures/pairs</option>
      </select></label>
    </div>
    <label class="f">Character<select id="charSel"></select></label>
    <label class="f" title="Characters in their official alternate outfits">Outfit<select id="outfitSel"></select></label>
    <label class="inline">Body in true random<select id="optBody">
      <option value="sometimes">50%</option><option value="always">Always</option><option value="never">Never</option>
    </select></label>
    <label class="inline" title="Any official: Random can land on an outfit, and true random can use outfit clothes">Outfits in random<select id="optOutfits">
      <option value="default">Default only</option><option value="any">Any official</option>
    </select></label>
    <div class="row3">
      <button id="btnRandChar" class="primary">Random</button>
      <button id="btnMix" class="primary">True random</button>
      <button id="btnCopy" class="primary copy">Copy prompt</button>
    </div>
    <p id="msg"></p>
    <div class="checks">
      <label><input type="checkbox" id="optFixed" checked> Include the quality tags</label>
      <label title="Off: the more creative, descriptive wording"><input type="checkbox" id="optDanbooru" checked> Danbooru tags only</label>
    </div>
    <div class="qhead">
      <div class="tabs">
        <button type="button" class="tab on" id="tabFixed" title="Quality tags: added at the start of every copied prompt, never randomized">Quality tags</button>
        <button type="button" class="tab" id="tabNeg" title="Negative prompt: for the negative box of your image tool">Negative</button>
      </div>
      <button type="button" id="btnResetBox" title="Put the original text back">Reset</button>
    </div>
    <textarea id="fixed" class="box" rows="6" spellcheck="false" aria-label="Quality tags"></textarea>
    <textarea id="neg" class="box" rows="6" spellcheck="false" aria-label="Negative prompt" hidden></textarea>
    <div class="qfoot">
      <span id="boxTok" class="tok" title="About how many tokens this box uses; every 75 tokens is one chunk"></span>
      <button type="button" id="btnCopyNeg" class="copy" title="Copies the negative prompt. Teen characters also get nsfw." hidden>Copy negative</button>
    </div>
  </section>

  <section class="panel">
    <div class="phead">
      <p id="title">Pick a character or press a random button</p>
      <span id="sure" class="badge" title="Written with less certainty: some design details may be off" hidden>less sure</span>
      <div class="tools">
        <button type="button" id="btnBack" title="Go back to the previous prompt" disabled>Back</button>
        <button type="button" id="btnFav" title="Save this prompt in this browser" disabled>☆ Save</button>
        <select id="favSel" title="Prompts you saved in this browser"></select>
      </div>
    </div>
    <p id="notes"></p>
    <div id="slots"></div>
  </section>

</main>
<textarea id="out" readonly tabindex="-1" aria-hidden="true"></textarea>

<script id="data" type="application/json">/*DATA*/</script>
<script>
"use strict";
const DEFAULT_FIXED = "(masterpiece:1.4), (best quality:1.3), (ultra detail:1.3), (8k resolution:1.2), absurdres, highres, sharp focus, skin texture, detailed shading, volumetric lighting, dramatic lighting, depth of field, vibrant colors, aesthetic, studio anime style, anime screencap style, clean lineart, awe-inspiring, amazing quality, ultra-detailed, detailed hair, individual hair strands, beautiful face, intricate face, soft lips, smooth skin, glossy skin, (artist:mazjojo:0.75), (artist:pigeon666:0.70),(artist:zawar379:0.80), (artist:remsrar:0.65),(artist:chimmyming:0.72), (artist:yoneyama mai:0.73), TAxStyle, Pixie_eyelashes, Wada Arco style,";
const LITE_DROP = ["skin texture", "soft lips", "smooth skin", "glossy skin"];
const GAMES = {1:"Custom prompts", 2:"Fantasy originals", 3:"Fate/Grand Order", 4:"Genshin Impact", 5:"Honkai: Star Rail", 6:"Epic Seven", 7:"Unicorn Overlord", 9:"Honkai Impact 3rd", 10:"Fire Emblem Heroes", 11:"Arknights", 12:"Azur Lane", 13:"Zenless Zone Zero", 14:"Blue Archive", 15:"Uma Musume", 16:"Granblue Fantasy", 17:"Nikke", 18:"Wuthering Waves", 19:"Punishing: Gray Raven", 20:"Reverse: 1999", 21:"Wulin"};
const SLOTS = [
  {k:"face",    label:"Face, hair, eyes, head accessories"},
  {k:"body",    label:"Body features"},
  {k:"clothes", label:"Clothes and accessories"},
  {k:"pose",    label:"Camera, pose and action"},
  {k:"scene",   label:"Setting, framing and body type"}
];
// Extra body-feature bundles for true random, so this section works for every gender and game (Danbooru tags only).
const BODY_POOL = [
  {name:"Scars", t:"(scar, scar on chest, scar on arm, scar on face)"},
  {name:"Tribal tattoos", t:"(tattoo, tribal, arm tattoo, shoulder tattoo)"},
  {name:"Glowing runes", t:"(glowing tattoo, runes, glowing)"},
  {name:"Dragon scales", t:"(scales, claws)"},
  {name:"Dragon tail", t:"(dragon tail, scales)"},
  {name:"Bat wings", t:"(bat wings, demon wings, black wings)"},
  {name:"Feathered wings", t:"(white wings, angel wings, feathered wings, large wings, falling feathers)"},
  {name:"Black feathered wings", t:"(black wings, feathered wings, black feathers)"},
  {name:"Demon tail", t:"(demon tail)"},
  {name:"Fox tails", t:"(fox tail, multiple tails)"},
  {name:"Cat tail", t:"(cat tail, tail raised)"},
  {name:"Wolf tail", t:"(wolf tail)"},
  {name:"Stitches", t:"(stitches, patchwork skin, two-tone skin)"},
  {name:"Extra eyes", t:"(extra eyes, third eye, body horror)"},
  {name:"Prosthetic arm", t:"(prosthetic arm, mechanical arms, mechanical hands)"},
  {name:"Doll joints", t:"(doll joints, joints)"},
  {name:"Crystal growths", t:"(crystal, glowing)"},
  {name:"Burn scars", t:"(burn scar, cracked skin, embers)"},
  {name:"Cursed arm", t:"(cracked skin, veins, glowing, dark aura)"},
  {name:"Bandages", t:"(bandages, bandaged arm, bandaged hand)"},
  {name:"Freckles", t:"(freckles, tan, tanlines)"},
  {name:"Body chains", t:"(chain, shackles, cuffs)"},
  {name:"Plant growth", t:"(vines, leaf, flower)"},
  {name:"Fins", t:"(head fins, fins, webbed hands, scales)"},
  {name:"Ghostly", t:"(see-through body, transparent, glowing)"},
  {name:"Insect wings", t:"(insect wings, butterfly wings)"},
  {name:"Third eye", t:"(third eye, forehead mark)"},
  {name:"Muscles", t:"(muscular, abs, veins, broad shoulders)"}
];
// The same bundles in the creative, descriptive wording (same order as BODY_POOL).
const BODY_POOL_CREATIVE = [
  {name:"Scars", t:"(scars, scar across chest, scar on arm, old battle scars, healed wounds)"},
  {name:"Tribal tattoos", t:"(tribal tattoo, arm tattoo, shoulder tattoo, black ink markings, linework tattoo)"},
  {name:"Glowing runes", t:"(glowing runes on skin, glowing tattoo, magic circuit lines, blue glowing markings)"},
  {name:"Dragon scales", t:"(scales on cheek, scaled forearms, scaled shoulders, iridescent scales, sharp claws)"},
  {name:"Dragon tail", t:"(thick dragon tail, scaled tail, tail spikes, tail curled behind)"},
  {name:"Bat wings", t:"(black bat wings, demon wings, leathery wings, wing claws, wings half spread)"},
  {name:"Feathered wings", t:"(white feathered wings, angel wings, large wings, drifting feathers)"},
  {name:"Black feathered wings", t:"(black feathered wings, fallen angel wings, ragged feathers, wings folded)"},
  {name:"Demon tail", t:"(demon tail, spade tail, slender black tail, tail curled upward)"},
  {name:"Fox tails", t:"(fox tail, large fluffy tail, multiple tails, white tail tips)"},
  {name:"Cat tail", t:"(cat tail, long slender tail, tail swaying, fluffy tail tip)"},
  {name:"Wolf tail", t:"(wolf tail, bushy grey tail, thick fur)"},
  {name:"Stitches", t:"(stitches, stitched skin, stitched arm, black thread, patchwork skin, two-tone skin)"},
  {name:"Extra eyes", t:"(extra eyes, additional eyes:1.2), (eye on forehead, eye on cheek, eye on hand), uneven eyes, body horror"},
  {name:"Prosthetic arm", t:"(mechanical arm, prosthetic arm, metal fingers, exposed gears, brass plating)"},
  {name:"Doll joints", t:"(doll joints, ball-jointed arms, seam lines on skin, porcelain skin)"},
  {name:"Crystal growths", t:"(crystal growths on skin, crystals on shoulders, glowing crystal shards embedded in arms)"},
  {name:"Burn scars", t:"(burn scars, burnt skin on arm, cracked skin, embers glowing in cracks)"},
  {name:"Cursed arm", t:"(cursed arm, black arm, blackened fingers, dark veins spreading, red glowing cracks)"},
  {name:"Bandages", t:"(bandages, bandaged arm, bandaged torso, wrapped hands, blood stains on bandages)"},
  {name:"Freckles", t:"(freckles, freckles on shoulders, sun-kissed skin, tan lines)"},
  {name:"Body chains", t:"(chains in skin, broken shackles on wrists, chain marks, rusted iron links)"},
  {name:"Plant growth", t:"(vines growing on body, leaves on skin, flowers sprouting from shoulders, bark-like skin patches)"},
  {name:"Fins", t:"(fin ears, head fins, small arm fins, scales on hips, webbed fingers)"},
  {name:"Ghostly", t:"(translucent body, ghostly fade at fingertips, wispy edges, faint blue glow)"},
  {name:"Insect wings", t:"(insect wings, translucent butterfly wings, iridescent wing pattern)"},
  {name:"Third eye", t:"(third eye, eye on forehead, glowing third eye, forehead mark)"},
  {name:"Muscles", t:"(muscular, toned abs, defined arms, veins, broad shoulders)"}
];
const $ = id => document.getElementById(id);
// Select a value if the list has it, otherwise the "Choose ..." line.
const setSel = (id, v) => { const s = $(id); s.value = v; if (s.value !== v) s.value = ""; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const trimTail = t => t.trim().replace(/[,\s]+$/, "");

// Split on commas that are outside brackets; "\(" and "\)" are literal and do not count.
function splitTop(s){
  const out = []; let depth = 0, cur = "";
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (c === "\\" && i + 1 < s.length){ cur += c + s[i+1]; i++; continue; }
    if (c === "(") depth++;
    else if (c === ")") depth = Math.max(0, depth - 1);
    if (c === "," && depth === 0){ if (cur.trim()) out.push(cur.trim()); cur = ""; }
    else cur += c;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

// The data is prebuilt by build.ps1 as one compact array per character:
// [code, name, part, group, gender(0 female, 1 male, 2 other), flags(1 short quality line, 2 several people, 4 less sure),
//  tag, face, body, clothes, pose, framing index, body-type tags, notes, extra BREAK lines,
//  official alternate outfits as [name, clothes, pose or "" to keep the default pose],
//  creative version: [face, body, clothes, pose, body-type tags, extra BREAK lines, outfits as [clothes, pose]]]
// Fields 7-15 are in Danbooru tags only; the creative version keeps the descriptive wording.
// The fixed parts of the last section are added back here instead of being stored for every character.
const COUNTS = ["solo, 1girl", "solo, 1boy", "solo, no humans", "2girls", "2boys", "1boy, 1girl", "solo, 1other"];
const GENDERS = ["female", "male", "other"];
function readData(rows){
  return rows.map(r => {
    const gender = GENDERS[r[4]], lite = !!(r[5] & 1), multi = !!(r[5] & 2), less = !!(r[5] & 4), c = r[16];
    return {
      code: r[0], name: r[1], part: r[2], group: r[3], game: GAMES[r[2]] || ("Part " + r[2]),
      gender, lite, multi, less, mixable: !lite && !multi && (gender === "male" || gender === "female"),
      tag: r[6], face: r[7], body: r[8], clothes: r[9], pose: r[10], cnt: r[11], bt: r[12],
      notes: r[13], extra: r[14] || [],
      outfits: (r[15] || []).map(o => ({name: o[0], clothes: o[1], pose: o[2]})),
      cre: c ? {face: c[0], body: c[1], clothes: c[2], pose: c[3], bt: c[4], extra: c[5] || [],
                outfits: (c[6] || []).map(o => ({clothes: o[0], pose: o[1]}))} : null
    };
  });
}

let DB = [], LIST = [];
// srcs: where each section came from, so the Danbooru / creative switch can redraw it.
// cur/outfit: the character and outfit shown (cur is null for a true random mix); favId: the saved mix shown, if any.
const state = {title:"", meta:"", notes:"", lite:false, mixable:false, gender:"", parts:{}, srcs:{}, locks:{}, cur:null, outfit:0, favId:null};

// "Danbooru tags only" on: the Danbooru version; off: the creative wording (character tags stay the Danbooru ones).
const danbooru = () => $("optDanbooru").checked;
const ver = e => (!danbooru() && e.cre) ? e.cre : e;
const bodyPool = () => danbooru() ? BODY_POOL : BODY_POOL_CREATIVE;
function sceneOf(e){
  const v = ver(e);
  return (danbooru() ? "(white background, simple background)" : "(white background, no background)") +
    ", (" + COUNTS[e.cnt] + ", cowboy shot), " + (v.bt ? v.bt + ", " : "") + "colored extremities";
}
// A section from its source: {e, n, full} = character e in outfit n (full: with its character tag and extra lines);
// for the body, {e} and/or {pi, pi2} = built-in body bundles; null = left empty.
function render(k, s){
  if (!s) return "";
  if (k === "body"){
    const P = bodyPool();
    let t = s.e ? ver(s.e).body : (s.pi != null ? P[s.pi].t : "");
    if (s.pi2 != null) t += (t ? ", " : "") + P[s.pi2].t;
    return t;
  }
  const e = s.e;
  if (k === "face") return (s.full && e.tag ? e.tag + " " : "") + ver(e).face;
  if (k === "clothes") return outfitParts(e, s.n || 0).clothes;
  if (k === "pose") return s.full ? outfitParts(e, s.n || 0).pose : ver(e).pose;
  if (k === "scene") return sceneOf(e);
  return "";
}
function restyle(){
  for (const s of SLOTS) if (s.k in state.srcs) state.parts[s.k] = render(s.k, state.srcs[s.k]);
  refresh();
}

function store(key, val){ try { if (val === undefined) return localStorage.getItem(key); localStorage.setItem(key, val); } catch(e){ return null; } }
function fixedLine(){ return $("fixed").value.replace(/\s*\n\s*/g, " ").trim() || DEFAULT_FIXED; }
// The negative prompt is copied on its own; for teen characters it always includes nsfw.
const DEFAULT_NEG = "(worst quality, low quality:1.4), lowres, bad anatomy, bad hands, missing fingers, extra fingers, fewer digits, extra digits, cropped, jpeg artifacts, blurry, signature, watermark, username, artist name, text, error";
function negLine(){
  let n = $("neg").value.replace(/\s*\n\s*/g, " ").trim() || DEFAULT_NEG;
  if (state.lite && !/(^|[,(\s])nsfw\s*(,|$|:)/i.test(n)) n = "nsfw, " + n;
  return n;
}

// About how many CLIP tokens a text uses. Emphasis brackets and weights are not tokens; escaped brackets are.
// Every 75 tokens is one chunk; a section past 75 spills into another chunk and its late tags pull less weight.
function tokenCount(t){
  const s = t.replace(/\\[()]/g, " # ").replace(/:\s*-?\d*\.?\d+\s*\)/g, ")").replace(/[()]/g, " ");
  const m = s.match(/[a-z]+|\d|[^\sa-z\d]/gi) || [];
  return m.reduce((n, w) => n + (w.length > 8 && /^[a-z]+$/i.test(w) ? 2 : 1), 0);
}
function tokInfo(t){
  const parts = (t || "").split(/\bBREAK\b/).map(tokenCount).filter(n => n > 0);
  return {total: parts.reduce((a, b) => a + b, 0), chunks: parts.reduce((a, n) => a + Math.ceil(n / 75), 0), over: parts.some(n => n > 75)};
}
function showTok(el, t){
  const i = tokInfo(t);
  el.textContent = i.total ? "~" + i.total + " tokens" + (i.chunks > 1 ? ", " + i.chunks + " chunks" : "") : "";
  el.classList.toggle("over", i.over);
}

function buildPrompt(){
  const lines = [];
  if ($("optFixed").checked){
    let fx = fixedLine();
    if (state.lite) fx = splitTop(fx).filter(t => LITE_DROP.indexOf(t.toLowerCase()) < 0).join(", ");
    fx = trimTail(fx) + ",";
    lines.push(fx);
  }
  for (const s of SLOTS){
    const t = trimTail(state.parts[s.k] || "");
    if (!t) continue;
    lines.push("BREAK " + t + (s.k === "scene" ? "" : ","));
  }
  return lines.join("\n");
}

const hasPrompt = () => SLOTS.some(s => (state.parts[s.k] || "").trim());
function refresh(){
  $("title").textContent = state.title || "Pick a character or press a random button";
  $("title").title = state.title || "";
  $("notes").textContent = state.notes;
  $("sure").hidden = !(state.cur && state.cur.less);
  for (const s of SLOTS){
    const ta = $("ta_" + s.k);
    if (ta.value !== (state.parts[s.k] || "")) ta.value = state.parts[s.k] || "";
    $("lock_" + s.k).checked = !!state.locks[s.k];
    $("slot_" + s.k).classList.toggle("locked", !!state.locks[s.k]);
    showTok($("tok_" + s.k), state.parts[s.k]);
  }
  $("out").value = buildPrompt();
  $("btnBack").disabled = !HIST.length;
  const saved = favs().some(f => f.id === favId());
  $("btnFav").disabled = !hasPrompt();
  $("btnFav").textContent = saved ? "★ Saved" : "☆ Save";
  $("btnFav").title = saved ? "Saved in this browser; click to remove it" : "Save this prompt in this browser";
  updateHash();
}

// Outfit 0 is the standard outfit; 1..n are the official alternates.
function outfitParts(e, n){
  const v = ver(e);
  const o = n > 0 ? v.outfits[n - 1] : null;
  return {
    clothes: o ? o.clothes : v.clothes,
    pose: (o && o.pose ? o.pose : v.pose) + v.extra.map(x => ",\nBREAK " + x).join("")
  };
}
// Character e in outfit n (0 = default). The Character list holds the default outfits and the Outfit list
// holds every official alternate outfit as its own entry; picking from one list clears the other.
function setChar(e, n, quiet){
  n = n || 0;
  if (!quiet) pushHist();
  state.favId = null;
  state.srcs = {face: {e, full: true}, body: {e}, clothes: {e, n}, pose: {e, n, full: true}, scene: {e}};
  state.parts = {};
  for (const s of SLOTS) state.parts[s.k] = render(s.k, state.srcs[s.k]);
  state.locks = {};
  state.cur = e; state.outfit = n;
  state.title = e.code + " " + e.name + (n ? ": " + e.outfits[n - 1].name : "");
  state.notes = e.notes;
  state.lite = e.lite; state.mixable = e.mixable; state.gender = e.gender;
  setSel("charSel", n ? "" : e.code);
  setSel("outfitSel", n ? e.code + "|" + n : "");
  $("msg").textContent = "";
  refresh();
}
const randomOutfit = e => ($("optOutfits").value === "any" && e.outfits.length) ? Math.floor(Math.random() * (e.outfits.length + 1)) : 0;

function mix(only){
  const game = $("fGame").value, fg = $("fGender").value;
  $("msg").textContent = "";
  if (fg === "other"){ $("msg").textContent = "True random only mixes single male or female characters. Set Gender to Any, Female or Male."; return; }
  // Gender "Any" mixes male and female freely, section by section; a set gender keeps every section to it.
  const g = fg;
  const pool = DB.filter(e => e.mixable && (!game || String(e.part) === game) && (!g || e.gender === g));
  if (!pool.length){ $("msg").textContent = g ? "No " + g + " characters to mix in this game." : "Nothing in this game can be mixed."; return; }
  pushHist(); state.favId = null;
  const anyLock = SLOTS.some(s => state.locks[s.k]);
  const keep = state.mixable && (!!only || anyLock);
  if (!keep){ state.locks = {}; only = null; state.parts = {}; state.srcs = {}; }
  for (const s of SLOTS){
    if (only && s.k !== only) continue;
    if (!only && state.locks[s.k]) continue;
    if (s.k === "body"){
      const mode = $("optBody").value;
      const use = only ? mode !== "never" : (mode === "always" || (mode === "sometimes" && Math.random() < 0.5));
      const P = bodyPool();
      // A body line that is only a skin tone ("(fair skin)") is not worth a pick of its own.
      const bp = pool.filter(e => { const b = ver(e).body; return b && !/^\(?\s*(fair|pale|light|porcelain|tan|tanned)( skin)?\s*\)?,?$/i.test(b.trim()); })
        .map(e => ({e})).concat(P.map((b, i) => ({pi: i})));
      if (use){
        const first = pick(bp), src = {e: first.e, pi: first.pi};
        if (Math.random() < 0.3){ const i2 = Math.floor(Math.random() * P.length); if (first.pi !== i2) src.pi2 = i2; }
        state.srcs.body = src;
      } else state.srcs.body = null;
      state.parts.body = render("body", state.srcs.body);
      continue;
    }
    const e = pick(pool);
    state.srcs[s.k] = s.k === "clothes" ? {e, n: randomOutfit(e)} : {e};
    state.parts[s.k] = render(s.k, state.srcs[s.k]);
  }
  state.title = "True random mix";
  state.notes = ""; state.lite = false; state.mixable = true; state.gender = g; state.cur = null; state.outfit = 0;
  $("charSel").value = ""; $("outfitSel").value = "";
  refresh();
}

// A dropdown with a count in its first line, grouped under headings; keeps the current pick when it still matches.
function fillSelect(sel, label, items){
  const cur = sel.value; sel.innerHTML = "";
  const first = document.createElement("option"); first.value = ""; first.textContent = label + " (" + items.length + ")"; sel.appendChild(first);
  let og = null, key = null;
  items.forEach(it => {
    if (it.grp !== key){ og = document.createElement("optgroup"); og.label = it.grp; sel.appendChild(og); key = it.grp; }
    const o = document.createElement("option"); o.value = it.v; o.textContent = it.t; og.appendChild(o);
  });
  sel.value = cur && items.some(it => it.v === cur) ? cur : "";
  sel.disabled = !items.length;
}
let OLIST = [];   // [{e, n}]: the official alternate outfits that match the filters
// Search: each comma-separated term must match. A term matches part of a code, name, group, game or outfit name,
// or a whole word or phrase in the tags (either version), so "fox ears" or "glasses" finds looks.
const lowKey = s => (s || "").toLowerCase().replace(/\\/g, "");
function searchTerms(q){
  return q.toLowerCase().split(",").map(t => t.trim()).filter(Boolean)
    .map(t => ({t, re: new RegExp("(^|[^a-z0-9])" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^a-z0-9])")}));
}
const matches = (terms, name, look) => terms.every(x => name.indexOf(x.t) >= 0 || x.re.test(look));
function indexLooks(e){
  const look = v => v ? [v.face, v.body, v.pose, v.bt].join(" , ") : "";
  e.nameKey = lowKey(e.code + " " + e.name + " " + e.group + " " + e.game);
  e.lookKey = lowKey([look(e), e.clothes, look(e.cre), e.cre ? e.cre.clothes : ""].join(" , "));
  e.outfitKeys = e.outfits.map((o, i) => {
    const co = e.cre && e.cre.outfits[i];
    return lowKey([look(e), o.clothes, o.pose, look(e.cre), co ? co.clothes + " , " + co.pose : ""].join(" , "));
  });
}
function rebuildList(){
  const game = $("fGame").value, g = $("fGender").value, terms = searchTerms($("fSearch").value);
  const pass = e => (!game || String(e.part) === game) && (!g || e.gender === g);
  LIST = DB.filter(e => pass(e) && (!terms.length || matches(terms, e.nameKey, e.lookKey)));
  OLIST = [];
  DB.forEach(e => { if (pass(e)) e.outfits.forEach((o, i) => {
    if (!terms.length || matches(terms, e.nameKey + " " + o.name.toLowerCase(), e.outfitKeys[i])) OLIST.push({e, n: i + 1});
  }); });
  const more = e => e.outfits.length ? "  (+" + e.outfits.length + (e.outfits.length > 1 ? " outfits)" : " outfit)") : "";
  fillSelect($("charSel"), "Choose a character", LIST.map(e => ({v: e.code, t: e.code + "  " + e.name + more(e), grp: e.game + (e.group ? " (" + e.group + ")" : "")})));
  fillSelect($("outfitSel"), "Choose an outfit", OLIST.map(x => ({v: x.e.code + "|" + x.n, t: x.e.code + "  " + x.e.name + ": " + x.e.outfits[x.n - 1].name, grp: x.e.game})));
}

// ---- Back, saved prompts and links ----------------------------------------------------------
// A snapshot keeps the text of every section (with your edits) and where each came from, by character code.
const HIST = [];
function snap(){
  const ser = s => s ? Object.assign({}, s, s.e ? {e: s.e.code} : {}) : null;
  const srcs = {}; for (const k in state.srcs) srcs[k] = ser(state.srcs[k]);
  return {title: state.title, notes: state.notes, lite: state.lite, mixable: state.mixable, gender: state.gender,
    cur: state.cur ? state.cur.code : null, outfit: state.outfit || 0, favId: state.favId, dan: danbooru(),
    locks: Object.assign({}, state.locks), parts: Object.assign({}, state.parts), srcs};
}
function restore(x){
  const byCode = c => DB.find(e => e.code === c) || null;
  const de = s => { if (!s) return null; const o = Object.assign({}, s); if (o.e != null){ o.e = byCode(o.e); if (!o.e) return null; } return o; };
  state.srcs = {}; for (const k in (x.srcs || {})) state.srcs[k] = de(x.srcs[k]);
  state.parts = Object.assign({}, x.parts); state.locks = Object.assign({}, x.locks);
  state.title = x.title || ""; state.notes = x.notes || ""; state.lite = !!x.lite; state.mixable = !!x.mixable; state.gender = x.gender || "";
  state.cur = x.cur ? byCode(x.cur) : null; state.outfit = state.cur ? (x.outfit || 0) : 0; state.favId = x.favId || null;
  if (state.cur && state.outfit > state.cur.outfits.length) state.outfit = 0;
  // Saved in the other version: redraw from the sources (edits made in that version are not kept).
  if (x.dan !== undefined && x.dan !== danbooru()) for (const s of SLOTS) if (s.k in state.srcs) state.parts[s.k] = render(s.k, state.srcs[s.k]);
  setSel("charSel", state.cur && !state.outfit ? state.cur.code : "");
  setSel("outfitSel", state.cur && state.outfit ? state.cur.code + "|" + state.outfit : "");
  $("msg").textContent = "";
  refresh();
}
function pushHist(){ if (hasPrompt()){ HIST.push(snap()); if (HIST.length > 50) HIST.shift(); } }

// Saved prompts live in this browser only. A character is saved as itself plus outfit; a mix gets its own id.
function favs(){ try { const a = JSON.parse(store("pp_favs") || "[]"); return Array.isArray(a) ? a : []; } catch(e){ return []; } }
const favId = () => state.cur ? "c:" + state.cur.code + "|" + (state.outfit || 0) : state.favId;
function fillFavs(){
  const a = favs(), sel = $("favSel"); sel.innerHTML = "";
  const first = document.createElement("option"); first.value = ""; first.textContent = "Saved (" + a.length + ")"; sel.appendChild(first);
  a.forEach(f => { const o = document.createElement("option"); o.value = f.id; o.textContent = f.title; sel.appendChild(o); });
  sel.disabled = !a.length;
}
function toggleFav(){
  if (!hasPrompt()) return;
  let a = favs(); const id = favId();
  if (id && a.some(f => f.id === id)) a = a.filter(f => f.id !== id);
  else {
    let title = state.title;
    if (!state.cur){
      state.favId = "m:" + Date.now();
      const names = ["face", "clothes", "pose"].map(k => state.srcs[k] && state.srcs[k].e ? state.srcs[k].e.name : null).filter(Boolean);
      title = names.length ? "Mix: " + names.filter((n, i) => names.indexOf(n) === i).join(" + ") : "True random mix";
    }
    a.unshift({id: favId(), title, snap: snap()});
  }
  store("pp_favs", JSON.stringify(a.slice(0, 100)));
  fillFavs(); refresh();
}

// The address shows the character (and outfit), e.g. #FE59 or #No005/bride, so a prompt can be bookmarked or shared.
const slug = s => s.replace(/[^A-Za-z0-9]+/g, "");
const oslug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
let BYSLUG = {};
function updateHash(){
  const h = state.cur ? "#" + slug(state.cur.code) + (state.outfit ? "/" + oslug(state.cur.outfits[state.outfit - 1].name) : "") : "";
  if (location.hash === h) return;
  try { history.replaceState(null, "", h || location.pathname + location.search); } catch(e){}
}
function fromHash(){
  const m = decodeURIComponent(location.hash.slice(1)).split("/"), e = BYSLUG[m[0]];
  if (!e) return false;
  let n = 0;
  if (m[1]){ n = e.outfits.findIndex(o => oslug(o.name) === m[1]) + 1; if (!n && /^\d+$/.test(m[1]) && +m[1] <= e.outfits.length) n = +m[1]; }
  if (state.cur === e && state.outfit === n) return true;
  setChar(e, n, !hasPrompt());
  return true;
}

function loadDB(rows){
  const d = readData(rows);
  if (!d.length) return false;
  DB = d;
  BYSLUG = {}; DB.forEach(e => { indexLooks(e); BYSLUG[slug(e.code)] = e; });
  const fg = $("fGame"), cur = fg.value; fg.innerHTML = "";
  const all = document.createElement("option"); all.value = ""; all.textContent = "All games (" + DB.length + ")"; fg.appendChild(all);
  const seen = {};
  DB.forEach(e => { seen[e.part] = (seen[e.part] || 0) + 1; });
  Object.keys(seen).sort((a, b) => a - b).forEach(p => {
    const o = document.createElement("option"); o.value = p; o.textContent = (GAMES[p] || ("Part " + p)) + " (" + seen[p] + ")"; fg.appendChild(o);
  });
  if (seen[cur]) fg.value = cur;
  rebuildList();
  return true;
}

function init(){
  const box = $("slots");
  SLOTS.forEach(s => {
    const d = document.createElement("div"); d.className = "slot"; d.id = "slot_" + s.k;
    d.innerHTML = '<div class="slot-head"><b></b><span class="src"></span>' +
      '<span class="tok" id="tok_' + s.k + '" title="About how many tokens this section uses. Each section is its own 75-token chunk; past 75 it spills into another chunk and its late tags pull less weight."></span>' +
      '<label><input type="checkbox" id="lock_' + s.k + '"> keep</label>' +
      '<button type="button" id="re_' + s.k + '" title="Reroll only this section">Reroll</button></div>' +
      '<textarea id="ta_' + s.k + '" rows="3" spellcheck="false"></textarea>';
    d.querySelector("b").textContent = s.label;
    box.appendChild(d);
    $("ta_" + s.k).addEventListener("input", ev => { state.parts[s.k] = ev.target.value; $("out").value = buildPrompt(); showTok($("tok_" + s.k), ev.target.value); });
    $("lock_" + s.k).addEventListener("change", ev => { state.locks[s.k] = ev.target.checked; refresh(); });
    $("re_" + s.k).addEventListener("click", () => mix(s.k));
  });

  // Quality tags and negative prompt share one box area; the tab picks which one shows.
  const boxes = {fixed: {def: DEFAULT_FIXED, key: "pp_fixed"}, neg: {def: DEFAULT_NEG, key: "pp_neg"}};
  let tab = store("pp_tab") === "neg" ? "neg" : "fixed";
  const showTab = t => {
    tab = t; store("pp_tab", t);
    $("fixed").hidden = t !== "fixed"; $("neg").hidden = t !== "neg";
    $("tabFixed").classList.toggle("on", t === "fixed"); $("tabNeg").classList.toggle("on", t === "neg");
    $("btnCopyNeg").hidden = t !== "neg";
    showTok($("boxTok"), $(t).value);
  };
  for (const id in boxes){
    $(id).value = store(boxes[id].key) || boxes[id].def;
    $(id).addEventListener("input", () => { store(boxes[id].key, $(id).value); $("out").value = buildPrompt(); showTok($("boxTok"), $(id).value); });
  }
  $("tabFixed").addEventListener("click", () => showTab("fixed"));
  $("tabNeg").addEventListener("click", () => showTab("neg"));
  $("btnResetBox").addEventListener("click", () => { $(tab).value = boxes[tab].def; store(boxes[tab].key, boxes[tab].def); $("out").value = buildPrompt(); showTok($("boxTok"), $(tab).value); });
  showTab(tab);
  $("optFixed").checked = store("pp_incfixed") !== "0";
  $("optFixed").addEventListener("change", () => { store("pp_incfixed", $("optFixed").checked ? "1" : "0"); $("out").value = buildPrompt(); });
  $("optDanbooru").checked = store("pp_danbooru") !== "0";
  $("optDanbooru").addEventListener("change", () => { store("pp_danbooru", $("optDanbooru").checked ? "1" : "0"); restyle(); });
  ["fGame", "fGender"].forEach(id => $(id).addEventListener("change", rebuildList));
  $("fSearch").addEventListener("input", rebuildList);
  $("charSel").addEventListener("change", () => { const e = DB.find(x => x.code === $("charSel").value); if (e) setChar(e, 0); });
  $("outfitSel").addEventListener("change", () => {
    const v = $("outfitSel").value, i = v.lastIndexOf("|"); if (i < 0) return;
    const e = DB.find(x => x.code === v.slice(0, i)); if (e) setChar(e, +v.slice(i + 1));
  });
  $("optOutfits").value = store("pp_outfits") === "any" ? "any" : "default";
  $("optOutfits").addEventListener("change", () => store("pp_outfits", $("optOutfits").value));
  // Random: any matching character; with "Any official" the matching outfits are in the draw too.
  $("btnRandChar").addEventListener("click", () => {
    const pool = LIST.map(e => ({e, n: 0})).concat($("optOutfits").value === "any" ? OLIST : []);
    if (!pool.length){ $("msg").textContent = "Nothing matches the filters."; return; }
    const x = pick(pool); setChar(x.e, x.n);
  });
  $("btnMix").addEventListener("click", () => mix(null));
  $("btnCopy").addEventListener("click", () => {
    if (!hasPrompt()){ $("msg").textContent = "Pick a character first."; return; }
    $("msg").textContent = "";
    copyText(buildPrompt(), $("btnCopy"), "Copy prompt");
  });
  $("btnCopyNeg").addEventListener("click", () => { $("msg").textContent = ""; copyText(negLine(), $("btnCopyNeg"), "Copy negative"); });

  $("btnBack").addEventListener("click", () => { const x = HIST.pop(); if (x) restore(x); else refresh(); });
  $("btnFav").addEventListener("click", toggleFav);
  $("favSel").addEventListener("change", () => {
    const f = favs().find(x => x.id === $("favSel").value); $("favSel").value = "";
    if (f && f.snap){ pushHist(); restore(Object.assign({}, f.snap, {favId: f.id})); }
  });
  window.addEventListener("hashchange", fromHash);

  loadDB(JSON.parse($("data").textContent));
  fillFavs();
  if (!(location.hash && fromHash())) refresh();
}
// Copy text to the clipboard and show it on the button for a moment.
function copyText(text, btn, label){
  const done = () => { btn.textContent = "Copied ✓"; btn.classList.add("done"); clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1500); };
  const fallback = () => {
    const o = $("out"); o.value = text; o.removeAttribute("readonly"); o.select();
    try { document.execCommand("copy"); done(); } catch(e){ $("msg").textContent = "Copy failed; your browser blocked it."; }
    o.setAttribute("readonly", ""); o.value = buildPrompt();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
init();
</script>
